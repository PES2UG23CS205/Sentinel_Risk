# SentinelRisk — Merchant Risk Intelligence Configuration
# Schema Version: sentinelrisk-merchant-v1

version: "sentinelrisk-merchant-v1"
description: "Deterministic merchant risk profiling, interpretable scoring weights, and anomaly alerting."

# --- Interpretable Merchant Risk Scoring Weights ---
scoring_weights:
  fraud_rate_weight: 0.25                 # Contribution from ground-truth or confirmed fraud rate
  velocity_anomaly_weight: 0.20           # Contribution from transaction velocity spikes
  high_risk_density_weight: 0.20          # Density of transactions flagged as REVIEW or HOLD
  customer_concentration_weight: 0.15     # Ratio of volume generated by top 2 customers
  trend_acceleration_weight: 0.20         # 1h vs 24h risk acceleration rate

# --- Merchant Risk Band Thresholds ---
risk_bands:
  low_max: 0.25
  medium_max: 0.60
  high_min: 0.60

# --- Deterministic Alert Trigger Thresholds ---
alert_thresholds:
  fraud_rate_spike_pct: 3.0               # Trigger if fraud rate exceeds 3.0%
  velocity_spike_count_1h: 15             # Trigger if 1-hour merchant volume exceeds 15 txns
  risk_score_high_threshold: 0.60         # Trigger if overall merchant risk score >= 0.60
  customer_concentration_pct: 50.0        # Trigger if top 2 customers account for > 50% volume
  collusive_cluster_min_cases: 2          # Trigger if >= 2 coordinated ring cases linked to merchant
